<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>NOS RSS Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: transparent;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
    }
    .ticker-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .ticker-track {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      animation: tickerScroll 45s linear infinite; /* Adjust speed here: lower seconds = faster, higher = slower */
    }
    .ticker-item {
      display: inline-block;
      font-size: 24px; /* Reduced font size */
      font-weight: 600;
      padding: 0 15px;
      color: #ffffff;
    }
    .ticker-item::after {
      content: " • ";
      color: #e30613; /* NOS Red accent dot */
      font-weight: bold;
      margin-left: 15px;
      margin-right: 10px;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-33.333%); } /* Scrolls precisely one full block of duplicated data */
    }
  </style>
</head>
<body>

  <div class="ticker-container" id="tickerContainer">
    <div class="ticker-track" id="tickerTrack">NOS Nieuws laden...</div>
  </div>

  <script>
    const RSS_URL = 'https://feeds.nos.nl/nosnieuwsalgemeen';
    const API_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_URL);
     
    const track = document.getElementById('tickerTrack');

    function renderHeadlines(items) {
      const headlines = items.map(item => `<span class="ticker-item">${item.title}</span>`).join('');
      // Duplicate 3 times to ensure a seamless CSS loop without visual gaps
      track.innerHTML = headlines + headlines + headlines;
    }

    async function fetchRSS() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (data.status === 'ok' && data.items.length > 0) {
          localStorage.setItem('nos_ticker_items', JSON.stringify(data.items));
          renderHeadlines(data.items);
        } else {
          loadCachedDataOrFallback('Kan NOS Nieuws feed niet laden.');
        }
      } catch (err) {
        loadCachedDataOrFallback('Fout bij het ophalen van het nieuws.');
      }
    }

    function loadCachedDataOrFallback(fallbackText) {
      const cached = localStorage.getItem('nos_ticker_items');
      if (cached) {
        renderHeadlines(JSON.parse(cached));
      } else {
        track.innerText = fallbackText;
      }
    }

    // Initialize cache first, then fetch fresh data
    const cachedItems = localStorage.getItem('nos_ticker_items');
    if (cachedItems) {
      renderHeadlines(JSON.parse(cachedItems));
    }

    fetchRSS();
    setInterval(fetchRSS, 3 * 60 * 1000); // Check for fresh news every 3 minutes
  </script>

</body>
</html>
